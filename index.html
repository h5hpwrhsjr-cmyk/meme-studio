<style>
:root{color-scheme:dark;--bg:#0d0e11;--panel:#15161b;--surface:#202127;--line:#30323a;--muted:#9b9da7;--ink:#f5f5f6;--accent:#79adff;--red:#ff4048;font-family:system-ui,-apple-system,BlinkMacSystemFont,"PingFang TC","Microsoft JhengHei",sans-serif}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-size:15px}button,input,textarea{font:inherit}button{color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:3px}button:disabled{opacity:.45;cursor:wait}.top{position:sticky;top:0;z-index:5;background:#0d0e11f5;border-bottom:1px solid #26272d;backdrop-filter:blur(16px);padding-top:env(safe-area-inset-top,0px)}.top-inner{max-width:1250px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 20px;min-height:66px}.brand{display:flex;align-items:center;gap:10px;min-width:0}.brand-mark{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:#ed303d;color:white;flex:none;transform:rotate(-5deg);font-weight:950;font-size:21px;box-shadow:0 3px 12px #ff303329}.brand-name{font-weight:850;font-size:20px;letter-spacing:-.5px;white-space:nowrap}.brand-name span{color:var(--accent)}.top-actions{display:flex;gap:8px;flex:none}.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 14px;font-weight:650;display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:43px;white-space:nowrap}.btn:hover{background:#2b2d35}.btn.primary{background:var(--accent);color:#101925;border-color:transparent;font-weight:800}.btn.primary:hover{background:#a1c6ff}.btn svg{width:17px;height:17px;flex:none}.layout{max-width:1250px;margin:auto;padding:22px 20px 48px;display:grid;grid-template-columns:minmax(0,1.4fr) minmax(330px,1fr);gap:24px;align-items:start}.preview-column{position:sticky;top:88px;min-width: ;color:#d5d6da;cursor:pointer}.custom-color input{width:24px;height:24px;border:0;padding:0;background:none;cursor:pointer}.custom-color input::-webkit-color-swatch-wrapper{padding:0}.custom-color input::-webkit-color-swatch{border:1px solid #777;border-radius:5px}.check-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.check-row label{display:flex;align-items:center;gap:8px;font-weight:600;color:#e1e1e5;font-size:14px;cursor:pointer}input[type=checkbox]{accent-color:var(--accent);width:18px;height:18px;margin:0;cursor:pointer}input[type=range]{display:block;width:100%;margin:3px 0;accent-color:var(--accent);cursor:pointer;height:24px}.poses{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.pose{position:relative;aspect-ratio:1.28;border:1px solid #353740;background:#222329;border-radius:10px;padding:0;overflow:hidden;min-width:0}.pose img{width:100%;height:100%;object-fit:cover;object-position:center top;display:block}.pose[data-pose="4"] img{object-fit:contain}.pose[aria-pressed=true]{border:2px solid var(--accent);box-shadow:0 0 0 1px var(--accent);background:radial-gradient(ellipse at 50% 70%,#4d2029,#24252b 75%)}.pose[aria-pressed=true]::after{content:'✓';position:absolute;right:5px;top:5px;background:var(--accent);color:#111b2a;border-radius:50%;width:20px;height:20px;display:grid;place-items:center;font-size:12px;font-weight:900}.two{display:flex;gap:8px}.two>*{flex:1;min-width:0}.seg{display:flex;background:#202127;border:1px solid #30323a;border-radius:9px;overflow:hidden;min-height:43px}.seg button{flex:1;border:0;background:transparent;font-weight:750;color:#aaaeb7}.seg button[aria-pressed=true]{background:#e7e7e8;color:#15161b}.seg button+button{border-left:1px solid #30323a}.side-row{display:flex;align-items:center;gap:10px}.side-row .seg{flex:1}.side-row label{flex:none;white-space:nowrap}.subtle{background:#1c1d23;font-size:13px;min-height:39px;padding:8px 10px}.bg-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8 const images=builtins.map(p=>({...p,img:new Image()}));
const initialText='這也行？\n太扯了吧！';
const defaultColor=line=>line%2===0?'#ffffff':'#ffeb22';
function colorsFor(s){let line=0;return s.split('').map(ch=>{const c=defaultColor(line);if(ch==='\n')line++;return c;});}
let state={pose:0,side:'left',flip:false,personSize:100,px:0,py:0,text:initialText,colors:colorsFor(initialText),textSize:100,rotation:-3,tx:0,ty:0,brush:true,bg:'red',glow:100};
let selection={start:0,end:0},toastTimer=0,drag=null,saveURL=null,saveBlob=null,ready=false;
const FONT='"Noto Sans CJK TC", "PingFang TC", "Microsoft JhengHei", "Heiti TC", "Noto Sans TC", system-ui, sans-serif';
const editor=$('caption');
function notify(msg){$('toast').textContent=msg;$('toast').classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').classList.remove('show'),2600);}
function lineAt(s,i){return s.slice(0,i).split('\n').length-1;}
function updateSelection(){selection={start:editor.selectionStart??0,end:editor.selectionEnd??0};const a=lineAt(state.text,selection.start),b=lineAt(state.text,Math.max(selection.start,selection.end-1));$('lineLabel').textContent=selection.end>selection.start?(a===b?'已選取文字':`第 ${a+1}–${b+1} 行`):`第 ${a+1} 行`;}
function editText(){const old=state.text,next=editor.value;let p=0,s=0;while(p<old.length&&p<next.length&&old[p]===next[p])p++;while(s<old.length-p&&s<next.length-p&&old[old.length-1-s]===next[next.length-1-s])s++;const insert=next.slice(p,next.length-s);let line=lineAt(next,p),color=p>0&&old[p-1]!=='\n'?state.colors[p-1]:(old[p]&&old[p]!=='\n'?state.colors[p]:defaultColor(line));const added=[];for(let i=0;i<insert.length;i++){const ch=insert[i];added.push(color||defaultColor(line));if(ch==='\n'){line++;color=defaultColor(line);}}state.colors=[...state.colors.slice(0,p),...added,...(s?state.colors.slice(old.length-s):[])];state.text=next;updateSelection();draw();}
function paintText(color){let {start,end}=selection;start=Math.min(start,state.text.length);end=Math.min(end,state.text.length);if(start===end){start=state.text.lastIndexOf('\n',start-1)+1;end=state.text.indexOf('\n',end);if(end===-1)end=state.text.length;}for(let i=start;i<end;i++)if(state.text[i]!=='\n')state.colors[i]=color;draw();}
function drawBackground(){ctx.fillStyle='#09090b';ctx.fillRect(0,0,W,H);if(state.bg==='dark'){const g=ctx.createLinearGradient(0,0,W,H);g.addColorStop(0,'#25252b');g.addColorStop(1,'#060608');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);return;}const cx=state.side==='left'?220:1060;ctx.save();ctx.translate(cx,280);ctx.scale(1.25,1);const g=ctx.createRadialGradient(0,0,30,0,0,625);const a=Math.min(1,state.glow/100),b=Math.min(1,state.glow/125);if(state.bg==='red'){g.addColorStop(0,`rgba(246,13,20,${a})`);g.addColorStop(.34,`rgba(187,5,12,${a})`);g.addColorStop(.67,`rgba(83,4,10,${b})`);}else{g.addColorStop(0,`rgba(39,89,246,${a})`);g.addColorStop(.34,`rgba(19,46,166,${a})`);g.addColorStop(.67,`rgba(8,20,70,${b})`);}g.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=g;ctx.fillRect(-1600,-900,3200,1800);ctx.restore();const v=ctx.createLinearGradient(0,0,0,H);v.addColorStop(0,'#00000012');v.addColorStop(.55,'#00000000');v.addColorStop(1,'#00000035');ctx.fillStyle=v;ctx.fillRect(0,0,W,H);}
function personRect(){const p=images[state.pose];if(!p||!p.img.naturalWidth)return null;const h=p.h*state.personSize/100,w=h*p.img.naturalWidth/p.img.naturalHeight;return {p,x:(state.side==='left'?260:1020)+(state.pose===0?(state.side==='left'?65:-65):0)-w/2+state.px,y:Math.max(8,H-h)+state.py,w,h};}
function drawPerson(){const r=personRect();if(!r)return;ctx.save();ctx.translate(r.x+r.w/2,r.y);ctx.scale(state.flip?-1:1,1);ctx.shadowColor='#0008';ctx.shadowBlur=12;ctx.drawImage(r.p.img,-r.w/2,0,r.w,r.h);ctx.restore();}
function setFont(size){ctx.font=`900 ${size}px ${FONT}`;ctx.textBaseline='middle';ctx.textAlign='left';if('fontKerning' in ctx)ctx.fontKerning='none';}
function glyphsFor(text,offset){let i=offset;return Array.from(text).map(ch=>{const g={ch,color:state.colors[i]||defaultColor(lineAt(state.text,i))};i+=ch.length;return g;});}
function drawBrush(width,y){ctx.save();ctx.translate(-width/2,y);ctx.fillStyle='#ff101d';ctx.beginPath();ctx.moveTo(0,18);ctx.quadraticCurveTo(22,-1,65,-4);ctx.bezierCurveTo(width*.36,-22,width*.76,-25,width,-20);ctx.lineTo(width*.75,-14);ctx.quadraticCurveTo(width*.34,0,width*.11,22);ctx.quadraticCurveTo(width*.02,32,0,18);ctx.fill();ctx.strokeStyle='#ff101d';ctx.lineWidth=2.5;ctx.beginPath();ctx.moveTo(width*.08,24);ctx.quadraticCurveTo(width*.46,-1,width*.99,-16);ctx.stroke();ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(width*.13,25);ctx.quadraticCurveTo(width*.53,-1,width*.88,-9);ctx.stroke();ctx.restore();}
function drawText(){const lines=state.text.split('\n');if(!state.text.trim())return;const boxWidth=650;let offset=0;const items=lines.map(text=>{const gs=glyphsFor(text,offset);offset+=text.length+1;setFont(100);const measure=gs.reduce((n,g)=>n+ctx.measureText(g.ch).width,0);const size=Math.min(248,boxWidth*100/Math.max(100,measure));return {gs,size,text};});let total=items.reduce((a,l)=>a+l.size*1.07,0);const k=Math.min(1,530/Math.max(1,total))*state.textSize/100;total*=k;const centerX=(state.side==='left'?925:355)+state.tx,centerY=H*.48+state.ty;ctx.save();ctx.translate(centerX,centerY);ctx.rotate(state.rotation*Math.PI/180);ctx.transform(1,0,-.10,1.12,0,0);let y=-total/2,lastWidth=0;for(const l of items){const size=Math.max(1,l.size*k);setFont(size);const widths=l.gs.map(g=>ctx.measureText(g.ch).width);const width=widths.reduce((a,b)=>a+b,0);const yy=y+size*.535;let x=-width/2;ctx.lineJoin='round';ctx.miterLimit=2;ctx.lineWidth=Math.max(3,size*.09);ctx.strokeStyle='#050506';ctx.shadowColor='#000c';ctx.shadowBlur=9;ctx.shadowOffsetX=3;ctx.shadowOffsetY=6;for(let i=0;i<l.gs.length;i++){ctx.strokeText(l.gs[i].ch,x,yy);x+=widths[i];}ctx.shadowColor='transparent';ctx.shadowBlur=0;ctx.shadowOffsetX=ctx.shadowOffsetY=0;x=-width/2;for(let i=0;i<l.gs.length;i++){ctx.fillStyle=l.gs[i].color;ctx.strokeStyle=l.gs[i].color;ctx.lineWidth=Math.max(.5,size*.028);ctx.strokeText(l.gs[i].ch,x,yy);ctx.fillText(l.gs[i].ch,x,yy);x+=widths[i];}y+=size*1.07;if(l.text.trim())lastWidth=width;}if(state.brush&&lastWidth>0)drawBrush(Math.min(700,Math.max(120,lastWidth*.95)),y+Math.min(20,10*k));ctx.restore();}
function draw(){ctx.clearRect(0,0,W,H);drawBackground();drawPerson();drawText();if(images[state.pose].img.naturalWidth){$('previewBox').classList.add('is-ready');}}
function renderPoses(){const grid=$('poses');grid.replaceChildren();images.forEach((p,i)=>{const b=document.createElement('button');b.type='button';b.className='pose';b.dataset.pose=i;b.setAttribute('aria-label',p.name);b.title=p.name;b.setAttribute('aria-pressed',String(i===state.pose));const im=document.createElement('img');im.src=p.src;im.alt=p.name;b.append(im);b.addEventListener('click',()=>selectPose(i));grid.append(b);});$('poseCount').textContent=images.length+' 張';}
function sync(){for(const id of ['textSize','rotation','personSize','glow']){$(id).value=state[id];$(id+'Val').textContent=state[id]+(id==='rotation'?'°':'%');}for(const id of ['brush','flip'])$(id).checked=state[id];document.querySelectorAll('[data-side]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.side===state.side)));document.querySelectorAll('[data-bg]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.bg===state.bg)));document.querySelectorAll('[data-pose]').forEach(b=>b.setAttribute('aria-pressed',String(+b.dataset.pose===state.pose)));}
function selectPose(i){state.pose=i;state.px=state.py=0;state.personSize=100;state.flip=false;sync();draw();}
for(const p of images){p.img.onload=()=>draw();p.img.onerror=()=>notify('部分人物素材載入失敗');p.img.src=p.src;}
renderPoses();sync();draw();
if(typeof Image.prototype.decode==='function'){Promise.all(images.map(p=>p.img.decode().catch(()=>{}))).then(()=>{ready=true;draw();});}

$('palette').querySelectorAll('[data-color]').forEach(b=>{b.addEventListener('pointerdown',e=>e.preventDefault());b.addEventListener('click',()=>paintText(b.dataset.color));});$('customColor').addEventListener('input',e=>paintText(e.target.value));
for(const id of ['textSize','rotation','personSize','glow'])$(id).addEventListener('input',e=>{state[id]=+e.target.value;$(id+'Val').textContent=state[id]+(id==='rotation'?'°':'%');draw();});for(const id of ['brush','flip'])$(id).addEventListener('change',e=>{state[id]=e.target.checked;draw();});
$('side').addEventListener('click',e=>{const b=e.target.closest('[data-side]');if(!b)return;if(state.side!==b.dataset.side){state.side=b.dataset.side;state.px=state.py=state.tx=state.ty=0;}sync();draw();});$('background').addEventListener('click',e=>{const b=e.target.closest('[data-bg]');if(!b)return;state.bg=b.dataset.bg;sync();draw();});
$('random').addEventListener('click',()=>{if(images.length<2)return;selectPose((state.pose+1+Math.floor(Math.random()*(images.length-1)))%images.length);});$('upload').addEventListener('click',()=>$('uploadFile').click());$('uploadFile').addEventListener('change',async e=>{const f=e.target.files[0];if(!f)return;const url=URL.createObjectURL(f),im=new Image();im.src=url;try{await im.decode();const h=Math.min(1200,Math.max(720,570*im.naturalHeight/im.naturalWidth));images.push({name:'自訂人像 '+(images.length-builtins.length+1),src:url,img:im,h});renderPoses();selectPose(images.length-1);notify('已加入自訂人像');}catch{URL.revokeObjectURL(url);notify('無法讀取圖片，請改用 PNG 或 JPG');}e.target.value='';});
$('resetText').addEventListener('click',()=>{state.tx=state.ty=0;state.textSize=100;state.rotation=-3;sync();draw();});$('resetPerson').addEventListener('click',()=>{state.px=state.py=0;state.personSize=100;state.flip=false;sync();draw();});$('resetAll').addEventListener('click',()=>{state={pose:0,side:'left',flip:false,personSize:100,px:0,py:0,text:initialText,colors:colorsFor(initialText),textSize:100,rotation:-3,tx:0,ty:0,brush:true,bg:'red',glow:100};editor.value=state.text;editor.setSelectionRange(0,0);updateSelection();sync();draw();notify('已重設');});
function point(e){const r=canvas.getBoundingClientRect();return {x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height};}
canvas.addEventListener('pointerdown',e=>{if(e.button!==0)return;const p=point(e),r=personRect();const textSide=state.side==='left'?p.x>W*.48:p.x<W*.52;const inPerson=r&&p.x>=r.x&&p.x<=r.x+r.w&&p.y>=r.y&&p.y<=r.y+r.h;const target=!textSide&&inPerson?'person':textSide?'text':'person';drag={target,x:p.x,y:p.y,ox:target==='person'?state.px:state.tx,oy:target==='person'?state.py:state.ty,id:e.pointerId};canvas.setPointerCapture(e.pointerId);});canvas.addEventListener('pointermove',e=>{if(!drag||drag.id!==e.pointerId)return;const p=point(e);const x=Math.max(-W,Math.min(W,drag.ox+p.x-drag.x)),y=Math.max(-H,Math.min(H,drag.oy+p.y-drag.y));if(drag.target==='person'){state.px=x;state.py=y;}else{state.tx=x;state.ty=y;}draw();});for(const ev of ['pointerup','pointercancel','lostpointercapture'])canvas.addEventListener(ev,()=>drag=null);
function png(){draw();return new Promise((res,rej)=>canvas.toBlob(b=>b?res(b):rej(new Error('PNG 產生失敗')),'image/png'));}
function showSave(blob){saveBlob=blob;if(saveURL)URL.revokeObjectURL(saveURL);saveURL=URL.createObjectURL(blob);$('saveImage').src=saveURL;$('saveFallback').classList.remove('hidden');}
$('closeSave').addEventListener('click',()=>{$('saveFallback').classList.add('hidden');if(saveURL){URL.revokeObjectURL(saveURL);saveURL=null;}});
$('shareSave').addEventListener('click',async()=>{if(!saveBlob)return;const f=new File([saveBlob],fileName(),{type:'image/png'});try{if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f]});return;}}catch(e){if(e.name==='AbortError')return;}const a=document.createElement('a');a.href=saveURL;a.download=f.name;document.body.append(a);a.click();a.remove();});
function fileName(){return 'meme-'+new Date().toISOString().replace(/[:.]/g,'-').slice(0,19)+'.png';}
$('download').addEventListener('click',async()=>{try{const blob=await png();if(/iPad|iPhone|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1)){showSave(blob);return;}const url=URL.createObjectURL(blob);const a=document.createElement('a');if('download' in a){a.href=url;a.download=fileName();document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),60000);notify('已產生 PNG 圖片');}else{URL.revokeObjectURL(url);showSave(blob);}}catch{notify('無法下載，請重試');}});
$('copy').addEventListener('click',async()=>{const promise=png();try{if(!navigator.clipboard||typeof ClipboardItem==='undefined')throw new Error('Clipboard unavailable');await navigator.clipboard.write([new ClipboardItem({'image/png':promise})]);notify('已複製圖片');}catch{try{showSave(await promise);}catch{notify('無法複製圖片');}}});
</script>
</body>
</html>
